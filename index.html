<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear My Valentine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" loop preload="auto" playsinline>
        <source src="assets/sounds/0214.MP3" type="audio/mpeg">
    </audio>

    <div class="main-container" id="loaderStage">
        <div class="bubble-container" id="bubbleLayer"></div>

       <div id="letter-container">
            <div class="envelope-wrapper">
                <div class="envelope-back"></div>
                <div class="envelope-flap"></div>
                
                <div id="draggableLetter" class="vintage-paper">
                    <div id="mainText" class="vintage-header">อ่านทำไม</div>
                    
                    <div id="fullMessage" style="display:none;">
                        <div id="line1" class="letter-content"></div>
                        <div id="line2" class="letter-content"></div>
                        <div id="line3" class="letter-content"></div>
                        <div id="line4" class="letter-content"></div>
                        <div id="line5" class="letter-content"></div>
                        <div id="line6" class="letter-content"></div>
                        <div id="line7" class="letter-content"></div>
                        <div id="line8" class="letter-content"></div>
                        <div id="line9" class="letter-content"></div>
                        <div id="line10" class="letter-content"></div>
                    </div>
                </div>
                    <div id="dragHintArrow" class="drag-arrow" style="opacity: 0;">
                    <span class="arrow-icon">↑ ↑ ↑</span>
                </div>

                <div class="envelope-front">
                    <div class="bow">🎀</div> </div>
            </div>
        </div>

        <div id="bouquet-overlay">
            <img src="assets/images/Bouquet.png" alt="Flower Bouquet" class="bouquet-img">
        </div>

        <div class="pot-and-garden-wrapper" id="contentGroup">
            <div class="garden" id="garden"></div>
            <div class="pot-container">
                <div class="pot-top"></div>
                <div class="pot-body"></div>
            </div>
            <div class="progress-text" id="percent">0%</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
