<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envelope Opening Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --env-color: #ffb6c1; /* ชมพูอ่อน */
            --env-dark: #ff99aa;
        }

        /* Container หลัก */
        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: var(--env-dark);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* ฝาพับจดหมาย (ใช้ Clip-path ทำรูปสามเหลี่ยม) */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--env-color);
            clip-path: polygon(0 0, 50% 50%, 100% 0);
            z-index: 3;
            transition: transform 0.5s ease, z-index 0.3s;
            transform-origin: top;
            border-radius: 10px;
        }

        /* ตัวซองด้านหน้า (รูปสามเหลี่ยมที่ปิดทับการ์ด) */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--env-color);
            clip-path: polygon(0 40%, 50% 100%, 100% 40%, 100% 100%, 0 100%);
            z-index: 4;
            border-radius: 10px;
        }

        /* การ์ดจดหมายที่อยู่ข้างใน */
        .letter-card {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 160px;
            background: white;
            z-index: 2;
            transition: transform 0.6s ease 0.4s; /* รอให้ฝาเปิดก่อนค่อยเลื่อนขึ้น */
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* เมื่อมีการกดเปิด (Active State) */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1; /* ส่งฝาพับไปข้างหลังเมื่อเปิดออก */
        }

        .envelope-wrapper.open .letter-card {
            transform: translate(-50%, -100px); /* ดีดตัวขึ้นมา */
        }

        /* เอฟเฟกต์กระดุกกระดิกตอนยังไม่เปิด */
        @keyframes wiggle {
            0%, 100% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.05) rotate(2deg); }
        }
        .waiting { animation: wiggle 1.2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-rose-50 h-screen flex flex-col items-center justify-center overflow-hidden">

    <div id="main-container" class="envelope-wrapper waiting" onclick="handleOpen()">
        <div class="flap"></div>
        
        <div class="letter-card text-center flex flex-col items-center justify-center">
            <p class="text-pink-500 font-bold">Hello!</p>
            <p class="text-xs text-gray-400 mt-2">จดหมายฉบับที่ 1 อยู่ที่นี่แล้ว...</p>
            <button class="mt-4 text-[10px] bg-pink-100 px-2 py-1 rounded text-pink-600">อ่านจดหมายทั้งหมด</button>
        </div>

        <div class="pocket"></div>
    </div>

    <p id="hint" class="mt-12 text-pink-300 font-medium animate-bounce">Click to open</p>

    <script>
        function handleOpen() {
            const envelope = document.getElementById('main-container');
            const hint = document.getElementById('hint');
            
            // เริ่มอนิเมชั่นเปิด
            envelope.classList.remove('waiting');
            envelope.classList.toggle('open');
            hint.classList.add('hidden');

            // หลังจากจดหมายเด้งขึ้นมาสักพัก (1 วินาที) ให้สลับไปโหมดสับจดหมายที่คุณอยากได้
            if(envelope.classList.contains('open')) {
                setTimeout(() => {
                    // ตรงนี้สามารถใส่ Logic สลับหน้าเว็บ หรือเรียก Function แสดง 5 จดหมายได้เลยครับ
                    // alert("จดหมายเปิดแล้ว! ต่อไปจะเข้าสู่โหมดสับจดหมาย 5 ใบ");
                }, 1500);
            }
        }
    </script>
</body>
</html>
